name: Lite validation and release

on:
  push:
    branches:
      - master
    tags:
      - lite-v*
      - tray-v*
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lite-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_VERSION: 4.18.2

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Check out source and frontend
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/lite-v')
        run: test "${GITHUB_REF_NAME}" = "lite-v${APP_VERSION}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Activate Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Build frontend assets
        working-directory: assets
        env:
          HUSKY: "0"
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          yarn install --frozen-lockfile --network-timeout 1000000
          yarn version --new-version "${APP_VERSION}" --no-git-tag-version
          yarn run build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.5
          cache: true

      - name: Run Lite Go tests
        run: >-
          go test
          ./application/...
          ./cmd/...
          ./routers/...
          ./inventory
          ./service/admin
          ./service/basic
          ./service/callback
          ./service/share
          ./service/user
          ./pkg/filemanager/manager

      - name: Build all Go packages
        run: go build ./...

      - name: Check entrypoint syntax
        run: sh -n scripts/docker-lite-entrypoint.sh

      - name: Build Lite image
        run: >-
          docker build
          --file Dockerfile.lite
          --build-arg APP_VERSION="${APP_VERSION}"
          --build-arg VCS_REF="${GITHUB_SHA}"
          --label org.opencontainers.image.revision="${GITHUB_SHA}"
          --label org.opencontainers.image.version="${APP_VERSION}"
          --tag cloudreve-lite:ci
          .

      - name: Smoke test Lite container
        run: |
          docker volume create cloudreve-lite-ci
          container_id="$(docker run --detach --read-only --tmpfs /tmp:size=32m,mode=1777 --volume cloudreve-lite-ci:/cloudreve/data --publish 127.0.0.1:5212:5212 cloudreve-lite:ci)"
          cleanup() {
            docker logs "${container_id}" || true
            docker rm --force "${container_id}" || true
            docker volume rm cloudreve-lite-ci || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:5212/api/v4/site/ping >/dev/null; then
              break
            fi
            if [ "${attempt}" -eq 45 ]; then
              echo "Lite container did not become healthy" >&2
              exit 1
            fi
            sleep 2
          done

          docker exec "${container_id}" test -f /cloudreve/data/conf.ini
          docker exec "${container_id}" test -f /opt/cloudreve/statics/index.html
          docker exec "${container_id}" test ! -e /cloudreve/data/statics
          curl --fail --silent http://127.0.0.1:5212/ >/dev/null

      - name: Publish Lite release
        if: startsWith(github.ref, 'refs/tags/lite-v') || startsWith(github.ref, 'refs/tags/tray-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          docker tag cloudreve-lite:ci "cloudreve-lite:${APP_VERSION}"
          docker save "cloudreve-lite:${APP_VERSION}" | gzip > "release/cloudreve-lite-${APP_VERSION}-linux-amd64.tar.gz"
          cp docker-compose.lite.yml release/
          (cd release && sha256sum *.tar.gz docker-compose.lite.yml > SHA256SUMS)
          cat > release/notes.md <<EOF
          Download links remain valid for 24 hours and are freshly signed on each request. Source-file cleanup observes the same grace period. Administrator account creation and updates validate email addresses and password length.

          Linux amd64 image: \`cloudreve-lite:${APP_VERSION}\`
          Source revision: \`${GITHUB_SHA}\`

          Verify the downloaded assets with \`sha256sum -c SHA256SUMS\`, import the image with \`docker load -i cloudreve-lite-${APP_VERSION}-linux-amd64.tar.gz\`, then start with \`docker compose -f docker-compose.lite.yml up -d --no-build --pull never\`.
          EOF
          if [[ "${GITHUB_REF_NAME}" == lite-v* ]]; then
            gh release create "${GITHUB_REF_NAME}" release/*.tar.gz release/docker-compose.lite.yml release/SHA256SUMS \
              --verify-tag --latest=false --title "CloudreveLite ${APP_VERSION}" --notes-file release/notes.md
            exit 0
          fi

          for attempt in {1..12}; do
            if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
              break
            fi
            gh release create "${GITHUB_REF_NAME}" \
              --verify-tag --latest=false \
              --title "CloudreveLite release ${GITHUB_REF_NAME#tray-}" \
              --notes-from-tag || true
            sleep 5
          done
          gh release upload "${GITHUB_REF_NAME}" release/*.tar.gz release/docker-compose.lite.yml release/SHA256SUMS --clobber
