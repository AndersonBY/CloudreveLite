name: Publish CloudreveLite Tray

on:
  push:
    tags:
      - tray-v*
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tray-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build signed Windows installer
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
        working-directory: CloudreveLiteTray
    env:
      CLOUDREVE_TRAY_SIGNING_PFX_BASE64: ${{ secrets.CLOUDREVE_TRAY_SIGNING_PFX_BASE64 }}
      CLOUDREVE_TRAY_SIGNING_PASSWORD: ${{ secrets.CLOUDREVE_TRAY_SIGNING_PASSWORD }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install stable-x86_64-pc-windows-msvc
          rustup default stable-x86_64-pc-windows-msvc

      - name: Check release version
        if: github.ref_type == 'tag'
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^tray-v', ''
          .\scripts\check-version.ps1 -ExpectedVersion $version

      - name: Check signing secrets
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CLOUDREVE_TRAY_SIGNING_PFX_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:CLOUDREVE_TRAY_SIGNING_PASSWORD)) {
              throw 'CloudreveLite Tray signing secrets are not configured.'
          }

      - name: Build signed installer
        run: .\build.ps1

      - name: Run Rust tests
        run: cargo test --workspace --locked

      - name: Smoke test unattended update
        run: .\scripts\smoke-update.ps1

      - name: Preserve update failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tray-update-diagnostics
          path: ${{ runner.temp }}/cloudreve-tray-update-*/roaming/CloudreveLiteTray/update.log
          if-no-files-found: ignore

      - name: Verify signer identity and generate checksum
        run: |
          $certificate = Join-Path $PWD 'build\cert\CloudreveLiteTray.cer'
          $expectedSigner = [Security.Cryptography.X509Certificates.X509Certificate2]::new($certificate)
          $signedPeFiles = @(
              'dist\CloudreveLiteTray-Setup.exe'
              'target\release\CloudreveTray.exe'
              'target\release\cloudreve_shell.dll'
          )
          foreach ($file in $signedPeFiles) {
              $path = (Resolve-Path -LiteralPath $file).Path
              $nativeSigner = [Security.Cryptography.X509Certificates.X509Certificate]::CreateFromSignedFile($path)
              $actualSigner = [Security.Cryptography.X509Certificates.X509Certificate2]::new($nativeSigner)
              if ($actualSigner.Thumbprint -ne $expectedSigner.Thumbprint) {
                  throw "$file was not signed by the configured release certificate."
              }
          }

          $msix = (Resolve-Path -LiteralPath 'target\release\CloudreveShell.msix').Path
          $package = [IO.Compression.ZipFile]::OpenRead($msix)
          try {
              if ($package.Entries.FullName -notcontains 'AppxSignature.p7x') {
                  throw 'CloudreveShell.msix does not contain an Appx signature block.'
              }
          } finally {
              $package.Dispose()
          }

          $setup = 'dist\CloudreveLiteTray-Setup.exe'
          $hash = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath 'dist\SHA256SUMS.txt' `
              -Value "$hash  CloudreveLiteTray-Setup.exe" -Encoding ascii

      - name: Upload release payload
        uses: actions/upload-artifact@v4
        with:
          name: cloudreve-lite-tray-${{ github.ref_name }}
          path: |
            CloudreveLiteTray/dist/CloudreveLiteTray-Setup.exe
            CloudreveLiteTray/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/tray-v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4

      - name: Download release payload
        uses: actions/download-artifact@v4
        with:
          name: cloudreve-lite-tray-${{ github.ref_name }}
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#tray-v}"
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --verify-tag \
            --latest=false \
            --title "CloudreveLite Tray v${version}" \
            --notes-from-tag
