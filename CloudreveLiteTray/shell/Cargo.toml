[package]
name = "cloudreve-shell"
version.workspace = true
edition.workspace = true

[lib]
name = "cloudreve_shell"
crate-type = ["cdylib"]

[dependencies]
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
